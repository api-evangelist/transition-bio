aid: transition-bio
name: Transition Bio
description: >-
  Transition Bio is a preclinical drug discovery company built on biomolecular condensate
  science, operating as a joint spin-out of the University of Cambridge and Harvard University
  with sites in Cambridge, Massachusetts and Cambridge, United Kingdom. The company combines
  droplet-microfluidics high-throughput molecular screening with a machine learning engine to
  identify and optimize small molecules that modulate intrinsically disordered proteins and the
  condensates they form, an approach the company has described as its Condensomics platform.
  It was seeded in November 2020 and closed a $50 million Series A in June 2022 led by Northpond
  Ventures with Taiho Ventures, Bristol Myers Squibb and Magnetic Ventures participating, and in
  November 2025 announced a collaboration with Voyager Therapeutics on small molecules targeting
  TDP-43 in ALS and frontotemporal dementia. Transition Bio is a therapeutics developer rather
  than a software or data vendor: it publishes no developer portal, no API documentation and no
  machine-readable API contract on any host it controls.
